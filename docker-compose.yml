version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gestaomfx-postgres
    environment:
      POSTGRES_USER: gestaomfx
      POSTGRES_PASSWORD: gestaomfx_dev_password_123
      POSTGRES_DB: gestaomfx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestaomfx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestaomfx-network

  redis:
    image: redis:7-alpine
    container_name: gestaomfx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestaomfx-network

volumes:
  postgres_data:
  redis_data:

networks:
  gestaomfx-network:
    driver: bridge
